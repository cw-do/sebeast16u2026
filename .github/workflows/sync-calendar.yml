name: Sync TeamSnap calendar

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download the latest TeamSnap calendar
        run: node scripts/sync-calendar.mjs

      - name: Commit calendar changes
        run: |
          if [ -z "$(git status --porcelain -- calendar.ics calendar-meta.json)" ]; then
            echo "Calendar is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calendar.ics calendar-meta.json
          git commit -m "Update TeamSnap calendar"
          git push
